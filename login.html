<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập / Đăng ký - KTA Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo"><a href="index.html"><img src="images/logoKTA.png" alt="Logo"></a></div>
            <div class="header-center"><h1 class="brand-name">KTA SHOP</h1></div>
            <div class="header-right"><nav class="checkout-nav"><a href="index.html">Trang chủ</a></nav></div>
        </div>
    </header>

    <div class="auth-container">
        <div id="login-form" class="auth-box">
            <h2>ĐĂNG NHẬP</h2>
            <input type="text" id="login-user" placeholder="Tên đăng nhập">
            <input type="password" id="login-pass" placeholder="Mật khẩu">
            <button onclick="handleLogin()" class="btn-auth">Đăng nhập</button>
            <p><a href="#" onclick="showForgotPassword()">Quên mật khẩu?</a></p>
            <p>Chưa có tài khoản? <a href="#" onclick="toggleAuth()">Đăng ký ngay</a></p>
        </div>

        <div id="register-form" class="auth-box" style="display: none;">
            <h2>ĐĂNG KÝ</h2>
            <input type="text" id="reg-user" placeholder="Tên đăng nhập mới">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Mật khẩu">
            <button onclick="handleRegister()" class="btn-auth">Đăng ký</button>
            <p>Đã có tài khoản? <a href="#" onclick="toggleAuth()">Đăng nhập</a></p>
        </div>

        <div id="forgot-form" class="auth-box" style="display: none;">
            <h2>QUÊN MẬT KHẨU</h2>
            <input type="text" id="forgot-user" placeholder="Nhập tên đăng nhập">
            <input type="password" id="new-pass" placeholder="Nhập mật khẩu mới">
            <button onclick="resetPassword()" class="btn-auth">Đổi mật khẩu</button>
            <p><a href="#" onclick="backToLogin()">Quay lại đăng nhập</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
