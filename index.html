<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Shop - Đồ Gia Dụng Cao Cấp</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <!-- Header/Menu -->
<header>
    <div class="logo">
        <a href="index.html">
            <img src="images/logoKTA.png" alt="Logo KTA">             
        </a>
    </div>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="#">Sản phẩm</a>
        <a href="cart.html" id="cart-link">Giỏ hàng (<span id="cart-count">0</span>)</a>
    </nav>
</header>

    <!-- Banner -->
    <section class="banner">
        <h2>MUA SẮM ĐỒ GIA DỤNG THÔNG MINH</h2>
        <p>Ưu đãi lên đến 40% - Bảo hành chính hãng</p>
    </section>

<!-- Danh mục sản phẩm -->
<section class="category-menu">
    <button onclick="renderProducts()">Tất cả</button>

    <button onclick="filterProducts('noi-chien')">
        Nồi Chiên
    </button>

    <button onclick="filterProducts('may-xay')">
        Máy Xay
    </button>

    <button onclick="filterProducts('bep-tu')">
        Bếp Từ
    </button>

    <button onclick="filterProducts('noi-com')">
        Nồi Cơm
    </button>

    <button onclick="filterProducts('quat')">
        Quạt
    </button>
</section>

<!-- Danh sách sản phẩm -->
<main>
    <h2 class="title">Sản Phẩm</h2>

    <div class="product-container" id="product-list">
        <!-- JS sẽ tự động đổ sản phẩm -->
    </div>
</main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
