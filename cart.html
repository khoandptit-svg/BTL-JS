<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - KTA Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <!-- Header giống trang chủ -->
<header>
    <div class="logo">
        <a href="index.html">
            <img src="images/logoKTA.png" alt="Logo KTA">             
        </a>
    </div>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="#">Sản phẩm</a>
        <a href="cart.html" id="cart-link">Giỏ hàng (<span id="cart-count">0</span>)</a>
    </nav>
</header>


    <main class="cart-page">
        <h2 class="title">Giỏ Hàng Của Bạn</h2>
        
        <div class="cart-container">
            <!-- Bảng danh sách sản phẩm -->
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá tiền</th>
                        <th>Số lượng</th>
                        <th>Tổng cộng</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="cart-table-body">
                    <!-- JS sẽ tự động đổ các dòng sản phẩm vào đây -->
                </tbody>
            </table>

            <!-- Khu vực tính tổng tiền và thanh toán -->
            <div class="cart-summary">
                <h3>Tóm tắt đơn hàng</h3>
                <p>Tổng tiền: <span id="total-price">0 đ</span></p>
                <button class="checkout-btn" onclick="checkout()">Tiến hành đặt hàng</button>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
